{% extends "base.html" %}

{% block title %}
Нова задача
{% endblock %}

{% block content %}
<div class="top-bar">
    <h2>Нова задача</h2>
</div>

<form class="task-form" method="post" action="{{ url_for('add_task') }}">
    {% if error %}
    <div class="form-error">{{ error }}</div>
    {% endif %}

    <label for="title">Назва</label>
    <input type="text" id="title" name="title" value="{{ title }}" placeholder="Що треба зробити?" autofocus>

    <label for="status">Статус</label>
    <select id="status" name="status">
        {% for status in statuses %}
        <option value="{{ status.value }}" {% if status.value == selected_status %}selected{% endif %}>
            {{ status.label }}
        </option>
        {% endfor %}
    </select>

    <div class="form-actions">
        <button class="button" type="submit">Зберегти</button>
        <a class="button button-secondary" href="{{ url_for('tasks') }}">Скасувати</a>
    </div>
</form>
{% endblock %}
